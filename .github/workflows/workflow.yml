name: Final Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Run tests with Gradle
        run: .\gradlew.bat clean test -Penv=staging --no-daemon --stacktrace
        env:
          GITHUB_ACTIONS: true
          BASE_URL: https://lms-b2b.do.dibimbing.id/dibimbingqa/login
          EMAIL: ${{ secrets.FINAL_PROJECT_UI_EMAIL }}
          PASSWORD: ${{ secrets.FINAL_PROJECT_UI_PASSWORD }}
